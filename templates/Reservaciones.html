<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Aesthetic Estética Integral</title>
    <link rel="stylesheet" href="../static/styles/Reservaciones.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Inicia tu reserva</h2>
            <img src="../static/media/Imagenes Pag. Reservaciones/logo_encabezado.png" alt="Logo Aesthetic" class="logo">
        </div>
        <div class="right-panel">
            <form class="reservation-form">
                <label for="nombre">Nombre del cliente</label>
                <input type="text" id="nombre" placeholder="Nombre del cliente">

                <label for="fecha">Fecha de reserva</label>
                <input type="date" id="fecha">

                <label for="hora">Hora de reserva</label>
                <select id="hora">
                    <option>10:00</option>
                    <option>11:00</option>
                    <option>12:00</option>
                    <option>13:00</option>
                    <option>17:00</option>
                    <option>18:00</option>
                    <option>19:00</option>
                    <option>20:00</option>
                </select>

                <label for="servicio">Servicio al que asistirá</label>
                <select id="servicio">
                    <option>Tratamiento Corporal</option>
                    <option>Tratamiento Facial</option>
                    <option>Depilacion</option>
                    <option>Spa de Manos</opction>
                    <option>Masaje</option>
                </select>

                <label for="metodo-pago">Método de pago</label>
                <select id="metodo-pago">
                    <option>Tarjeta</option>
                    <option>Efectivo</option>
                    <option>Transferencia</option>
                </select>

                <button type="submit" class="submit-button">Confirmar reserva</button>
            </form>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>
                <strong>© 2024 Para Estetica AESTHETIC. Creado por el Equipo 4</strong>
            </p>
        </div>
        <div class="social-icons">
            <a href="https://www.facebook.com/profile.php?id=61563739507826" target="_block" class="iconofacebook">
                <img src="../static/media/Imagenes Pag. Principal/facebook.png"
                    alt="logofacebook" />
            </a>
            <a href="https://www.instagram.com/aesthetic2024_ok?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_block" class="iconoinstagram">
                <img src="../static/media/Imagenes Pag. Principal/instagram.png"
                    alt="logoinstagram" />
            </a>
            <a href="https://www.linkedin.com/in/aesthetic-estetica-163b4b330/" target="_block" class="iconolinkedin">
                <img src="../static/media/Imagenes Pag. Principal/linkedin.png"
                    alt="logolinkedin" />
            </a>
        </div>
    </footer>
</body>
</html>
